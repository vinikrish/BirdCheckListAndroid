<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8F5E8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGradient)"/>
  
  <!-- Decorative Birds -->
  <g opacity="0.3">
    <!-- Bird 1 -->
    <g transform="translate(50, 50)">
      <ellipse cx="20" cy="30" rx="18" ry="12" fill="#2E7D32"/>
      <circle cx="10" cy="20" r="10" fill="#2E7D32"/>
      <polygon points="2,18 0,20 2,22" fill="#FF6F00"/>
    </g>
    
    <!-- Bird 2 -->
    <g transform="translate(900, 80)">
      <ellipse cx="20" cy="30" rx="18" ry="12" fill="#2E7D32"/>
      <circle cx="10" cy="20" r="10" fill="#2E7D32"/>
      <polygon points="2,18 0,20 2,22" fill="#FF6F00"/>
    </g>
    
    <!-- Bird 3 -->
    <g transform="translate(100, 400)">
      <ellipse cx="20" cy="30" rx="18" ry="12" fill="#2E7D32"/>
      <circle cx="10" cy="20" r="10" fill="#2E7D32"/>
      <polygon points="2,18 0,20 2,22" fill="#FF6F00"/>
    </g>
  </g>
  
  <!-- Main Title -->
  <text x="512" y="120" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle">
    Bird Life List
  </text>
  
  <!-- Subtitle -->
  <text x="512" y="170" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle" opacity="0.9">
    Track Your Bird Sightings Worldwide
  </text>
  
  <!-- Phone Mockup -->
  <g transform="translate(400, 200)">
    <!-- Phone Frame -->
    <rect x="0" y="0" width="224" height="280" rx="20" fill="#333" stroke="#222" stroke-width="2"/>
    <rect x="8" y="8" width="208" height="264" rx="16" fill="url(#phoneGradient)"/>
    
    <!-- Screen Content -->
    <!-- Header -->
    <rect x="16" y="16" width="192" height="40" fill="#4CAF50" rx="4"/>
    <text x="112" y="40" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Bird Life List</text>
    
    <!-- Bird List Items -->
    <!-- Item 1 -->
    <rect x="24" y="70" width="176" height="32" fill="white" rx="4" stroke="#E0E0E0"/>
    <rect x="32" y="78" width="12" height="12" fill="#4CAF50" rx="2"/>
    <path d="M35 84 L38 87 L44 81" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="52" y="88" font-family="Arial, sans-serif" font-size="12" fill="#333">American Robin</text>
    <text x="180" y="88" font-family="Arial, sans-serif" font-size="10" fill="#666">✓</text>
    
    <!-- Item 2 -->
    <rect x="24" y="110" width="176" height="32" fill="white" rx="4" stroke="#E0E0E0"/>
    <rect x="32" y="118" width="12" height="12" fill="#4CAF50" rx="2"/>
    <path d="M35 124 L38 127 L44 121" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="52" y="128" font-family="Arial, sans-serif" font-size="12" fill="#333">Northern Cardinal</text>
    <text x="180" y="128" font-family="Arial, sans-serif" font-size="10" fill="#666">✓</text>
    
    <!-- Item 3 -->
    <rect x="24" y="150" width="176" height="32" fill="white" rx="4" stroke="#E0E0E0"/>
    <rect x="32" y="158" width="12" height="12" fill="#E0E0E0" rx="2"/>
    <text x="52" y="168" font-family="Arial, sans-serif" font-size="12" fill="#666">Blue Jay</text>
    
    <!-- Item 4 -->
    <rect x="24" y="190" width="176" height="32" fill="white" rx="4" stroke="#E0E0E0"/>
    <rect x="32" y="198" width="12" height="12" fill="#E0E0E0" rx="2"/>
    <text x="52" y="208" font-family="Arial, sans-serif" font-size="12" fill="#666">House Sparrow</text>
    
    <!-- Bottom Navigation -->
    <rect x="16" y="240" width="192" height="24" fill="#F5F5F5" rx="4"/>
    <text x="60" y="254" font-family="Arial, sans-serif" font-size="10" fill="#4CAF50" font-weight="bold">LIFE LIST</text>
    <text x="112" y="254" font-family="Arial, sans-serif" font-size="10" fill="#666">ADD BIRDS</text>
    <text x="164" y="254" font-family="Arial, sans-serif" font-size="10" fill="#666">ABOUT</text>
  </g>
  
  <!-- Features Text -->
  <g transform="translate(50, 300)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="bold">✓ Track bird sightings by location</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="bold">✓ Automatic country detection</text>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="bold">✓ Comprehensive bird database</text>
  </g>
  
  <g transform="translate(700, 300)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="bold">✓ Photo and note support</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="bold">✓ Secure cloud backup</text>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="bold">✓ Easy to use interface</text>
  </g>
</svg>